# Railway Nixpacks Configuration
[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = [
    "pip install --upgrade pip",
    "pip install -r requirements-prod.txt"
]

[phases.build]
cmds = [
    "python manage.py collectstatic --no-input",
    # Pre-download the FastEmbed model into the Docker image at build time.
    # This means the model is already on disk when workers start — they still
    # make a few lightweight HF metadata/hash-validation calls on load, but
    # the heavy ONNX model file (~130 MB) is NOT re-downloaded on every deploy.
    "FASTEMBED_CACHE_PATH=/app/.fastembed_cache python -c \"from fastembed import TextEmbedding; print('Pre-caching FastEmbed BAAI/bge-base-en-v1.5 ...'); list(TextEmbedding(model_name='BAAI/bge-base-en-v1.5', cache_dir='/app/.fastembed_cache').embed(['warmup'])); print('FastEmbed model cached OK.')\""
]

[start]
cmd = "python manage.py collectstatic --no-input && python manage.py migrate --no-input && daphne -b 0.0.0.0 -p $PORT technicians.asgi:application"
