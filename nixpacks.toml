# Railway Nixpacks Configuration
[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = [
    "pip install --upgrade pip",
    "pip install -r requirements-prod.txt"
]

[phases.build]
cmds = [
    "python manage.py collectstatic --no-input",
    "python -c \"import os; from fastembed import TextEmbedding; cache = os.environ.get('FASTEMBED_CACHE_PATH', '.fastembed_cache'); TextEmbedding(model_name='BAAI/bge-base-en-v1.5', cache_dir=cache)\""
]

[start]
cmd = "python manage.py collectstatic --no-input && python manage.py migrate --no-input && daphne -b 0.0.0.0 -p $PORT technicians.asgi:application"
